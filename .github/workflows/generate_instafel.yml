name: Generate Instafel (Full Online Pipeline)

on:
  repository_dispatch:
    types: [generate_instafel]
  workflow_dispatch:
    inputs:
      base_apk_url:
        description: 'Direct URL for Base Instagram APK (Leave empty to auto-fetch via GPlayAPI)'
        required: false
        default: ''
      rconf_apk_url:
        description: 'Direct URL for Density Config APK (Leave empty to auto-fetch via GPlayAPI)'
        required: false
        default: ''
      build_patcher_from_source:
        description: 'Build Patcher, Patcher-Core, and App from local source'
        type: boolean
        default: true

jobs:
  ifl_generator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 21 & Android Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '21'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Fetch or Configure Target Instagram APK
        id: fetch_alpha
        env:
          GPLAY_EMAIL: ${{ secrets.GPLAY_EMAIL }}
          GPLAY_AAS_TOKEN: ${{ secrets.GPLAY_AAS_TOKEN }}
        run: |
          BASE_URL="${{ github.event.client_payload.base.url || inputs.base_apk_url }}"
          RCONF_URL="${{ github.event.client_payload.rconf.url || inputs.rconf_apk_url }}"

          if [ -n "$BASE_URL" ] && [ -z "$RCONF_URL" ]; then
            echo "Single direct APK URL provided. Downloading directly as instagram.apk..."
            wget -q -O instagram.apk "$BASE_URL"
            echo "has_merged_apk=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ -z "$BASE_URL" ] || [ -z "$RCONF_URL" ]; then
            if [ -n "$GPLAY_EMAIL" ] && [ -n "$GPLAY_AAS_TOKEN" ]; then
              echo "Fetching latest Alpha release from Google Play API..."
              GPLAY_OUTPUT=$(./gradlew :gplayapi:run --args="email=$GPLAY_EMAIL aasToken=$GPLAY_AAS_TOKEN" --quiet | grep -o '{"versionName".*}')
              BASE_URL=$(echo "$GPLAY_OUTPUT" | jq -r '.apkUrlBase')
              RCONF_URL=$(echo "$GPLAY_OUTPUT" | jq -r '.apkUrlRes')
              echo "Fetched version: $(echo "$GPLAY_OUTPUT" | jq -r '.versionName')"
            else
              echo "Error: Please provide a direct Instagram APK URL or configure GPLAY_EMAIL & GPLAY_AAS_TOKEN in GitHub secrets."
              exit 1
            fi
          fi

          echo "base_url=$BASE_URL" >> $GITHUB_OUTPUT
          echo "rconf_url=$RCONF_URL" >> $GITHUB_OUTPUT
          echo "has_merged_apk=false" >> $GITHUB_OUTPUT

      - name: Download & Merge Split APKs
        if: steps.fetch_alpha.outputs.has_merged_apk != 'true'
        run: |
          mkdir -p apks
          echo "Downloading Instagram Alpha splits..."
          wget -q -O apks/base.apk "${{ steps.fetch_alpha.outputs.base_url }}"
          wget -q -O apks/rconf.apk "${{ steps.fetch_alpha.outputs.rconf_url }}"

          echo "Downloading APKEditor..."
          wget -q "https://github.com/REAndroid/APKEditor/releases/download/V1.4.5/APKEditor-1.4.5.jar"

          echo "Merging APK splits into instagram.apk..."
          java -jar APKEditor-1.4.5.jar m -i apks -o instagram.apk

      - name: Fetch Custom Emojis & Fonts Assets
        run: |
          echo "Fetching Google 3D Emojis and iOS Emojis..."
          mkdir -p assets_bundle/emojis assets_bundle/fonts/sf_pro

          # Fetch Google 3D Emoji TTF from latest release
          wget -q -O assets_bundle/emojis/GoogleEmoji3D.ttf \
            "https://github.com/junksidetm/Google-Emoji-3D/releases/download/v1.1.1/GoogleEmoji3D.ttf" || echo "GoogleEmoji3D fallback"

          # Fetch iOS 26.4 Emoji TTF from user assests repo
          wget -q -O assets_bundle/emojis/iOS_26.4.ttf \
            "https://raw.githubusercontent.com/junksidetm/assests/main/Emojis/iOS%2026.4.ttf" || echo "iOS emoji fallback"

          # Fetch Apple San Francisco Pro fonts
          git clone --depth 1 https://github.com/junksidetm/assests.git assests_repo
          if [ -d "assests_repo/fonts/IOS - San Francisco/SF-Pro" ]; then
            cp -r "assests_repo/fonts/IOS - San Francisco/SF-Pro"/* assets_bundle/fonts/sf_pro/
          fi

          # Fetch Google Sans Flex
          wget -q -O assets_bundle/fonts/GoogleSansFlex.ttf \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/googlesansflex/GoogleSansFlex%5BGRAD%2CROND%2Copsz%2Cslnt%2Cwdth%2Cwght%5D.ttf" || echo "GSF fallback"

          rm -rf assests_repo

      - name: Build Instafel Engine & Update Patcher Sources
        run: |
          echo "Building :app and updating patcher-core embedded sources..."
          ./gradlew updatePatcherSources
          ./gradlew :patcher:build-jar

      - name: Initialize Decompilation
        run: |
          PATCHER_JAR=$(find .output -name "ifl-patcher*.jar" | head -n 1)
          echo "Using patcher: $PATCHER_JAR"
          java -jar "$PATCHER_JAR" about
          java -jar "$PATCHER_JAR" init instagram.apk

      - name: Bundle Fonts & Emojis into Target APK
        run: |
          echo "Copying fonts and emoji assets into target APK..."
          mkdir -p instagram/sources/assets/fonts/sf_pro
          mkdir -p instagram/sources/assets/emojis

          cp -r assets_bundle/fonts/* instagram/sources/assets/fonts/
          cp -r assets_bundle/emojis/* instagram/sources/assets/emojis/

      - name: Run Patches (with Typography & Emojis)
        run: |
          PATCHER_JAR=$(find .output -name "ifl-patcher*.jar" | head -n 1)
          java -jar "$PATCHER_JAR" run instagram unlock_developer_options remove_ads amoled_theme remove_snooze_warning instafel font_emoji change_channel_name clone

      - name: Build & Sign Final APK
        run: |
          PATCHER_JAR=$(find .output -name "ifl-patcher*.jar" | head -n 1)
          java -jar "$PATCHER_JAR" build instagram

      - name: Upload Production APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: instafel-production-apk
          path: instagram/instagram-signed.apk
          if-no-files-found: warn
