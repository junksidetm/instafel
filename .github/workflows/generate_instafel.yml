name: Generate Instafel (Full Online Pipeline)

on:
  schedule:
    # Run automatically every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  repository_dispatch:
    types: [generate_instafel]
  workflow_dispatch:
    inputs:
      base_apk_url:
        description: 'Direct URL for Base Instagram APK (Leave empty to auto-crawl latest Alpha from APKMirror)'
        required: false
        default: ''
      force_build:
        description: 'Force build even if this Alpha version was already released'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  ifl_generator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 21 & Android Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '21'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Auto-Discover & Download Latest Instagram Alpha
        id: alpha_crawler
        if: ${{ !inputs.base_apk_url }}
        run: |
          mkdir -p downloads
          DOWNLOAD_DIR="downloads" node scripts/download-instagram-alpha.mjs

      - name: Fallback Direct URL Download (If manual URL provided)
        id: manual_dl
        if: ${{ inputs.base_apk_url }}
        run: |
          mkdir -p downloads
          echo "Downloading from manual base_apk_url: ${{ inputs.base_apk_url }}"
          wget -q -O downloads/instagram_manual.apk "${{ inputs.base_apk_url }}"
          echo "file_path=downloads/instagram_manual.apk" >> $GITHUB_OUTPUT

      - name: Prepare Base Instagram APK & Check Existing Release
        id: prepare_apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DOWNLOADED_FILE="${{ steps.manual_dl.outputs.file_path || steps.alpha_crawler.outputs.file_path }}"
          if [ -z "$DOWNLOADED_FILE" ] || [ ! -f "$DOWNLOADED_FILE" ]; then
            DOWNLOADED_FILE=$(find downloads -type f \( -name "*.apk" -o -name "*.apkm" -o -name "*.xapk" -o -name "*.zip" \) 2>/dev/null | head -n 1)
          fi

          if [ -z "$DOWNLOADED_FILE" ] || [ ! -f "$DOWNLOADED_FILE" ]; then
            echo "::error::Failed to download Instagram package. No package file found in downloads directory."
            exit 1
          fi

          echo "Found package file: $DOWNLOADED_FILE"

          # Download APKEditor for split extraction / merging
          wget -q -O APKEditor.jar "https://github.com/REAndroid/APKEditor/releases/download/V1.4.5/APKEditor-1.4.5.jar"

          if [[ "$DOWNLOADED_FILE" == *.apkm ]] || [[ "$DOWNLOADED_FILE" == *.xapk ]] || [[ "$DOWNLOADED_FILE" == *.zip ]]; then
            mkdir -p /tmp/inspect_zip
            if command -v 7z >/dev/null 2>&1; then
              echo "Extracting bundle with 7z..."
              7z x -y "$DOWNLOADED_FILE" -o/tmp/inspect_zip
            else
              echo "Extracting bundle with unzip / python..."
              unzip -q -o "$DOWNLOADED_FILE" -d /tmp/inspect_zip || python3 -m zipfile -e "$DOWNLOADED_FILE" /tmp/inspect_zip
            fi
            APK_COUNT=$(find /tmp/inspect_zip -name "*.apk" | wc -l)
            if [ "$APK_COUNT" -gt 1 ]; then
              echo "Package is a multi-APK split bundle ($APK_COUNT APKs found). Merging splits with APKEditor..."
              mkdir -p apks
              cp /tmp/inspect_zip/*.apk apks/
              java -jar APKEditor.jar m -i apks -o instagram.apk
            elif [ "$APK_COUNT" -eq 1 ]; then
              echo "Single APK found inside archive. Extracting..."
              cp $(find /tmp/inspect_zip -name "*.apk" | head -n 1) instagram.apk
            else
              echo "Archive extraction fallback."
              cp "$DOWNLOADED_FILE" instagram.apk
            fi
            rm -rf /tmp/inspect_zip
          else
            echo "Package is a standalone APK. Copying to instagram.apk..."
            cp "$DOWNLOADED_FILE" instagram.apk
          fi

          # Extract version from steps output or fallback to aapt
          VERSION="${{ steps.alpha_crawler.outputs.version }}"
          if [ -z "$VERSION" ]; then
            AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt 2>/dev/null | head -n 1)
            if [ -n "$AAPT" ] && [ -f "instagram.apk" ]; then
              VERSION=$($AAPT dump badging instagram.apk 2>/dev/null | grep "versionName" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
            fi
          fi
          if [ -z "$VERSION" ]; then
            VERSION="alpha-$(date +'%Y%m%d%H%M')"
          fi
          echo "Resolved Instagram Version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Version Check: Skip build if already released and force_build is false
          if [ "${{ inputs.force_build }}" != "true" ]; then
            if gh release view "v${VERSION}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              echo "Release v${VERSION} already exists on GitHub Releases! Skipping build to conserve resources."
              echo "skip_build=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          echo "skip_build=false" >> $GITHUB_OUTPUT

      - name: Fetch Custom Emojis & Fonts Assets
        if: steps.prepare_apk.outputs.skip_build != 'true'
        run: |
          echo "Fetching Google 3D Emojis and iOS Emojis..."
          mkdir -p assets_bundle/emojis assets_bundle/fonts/sf_pro

          # Fetch Google 3D Emoji TTF from latest release
          wget -q -O assets_bundle/emojis/GoogleEmoji3D.ttf \
            "https://github.com/junksidetm/Google-Emoji-3D/releases/download/v1.1.1/GoogleEmoji3D.ttf" || echo "GoogleEmoji3D fallback"

          # Fetch iOS 26.4 Emoji TTF from user assests repo
          wget -q -O assets_bundle/emojis/iOS_26.4.ttf \
            "https://raw.githubusercontent.com/junksidetm/assests/main/Emojis/iOS%2026.4.ttf" || echo "iOS emoji fallback"

          # Fetch Apple San Francisco Pro fonts
          git clone --depth 1 https://github.com/junksidetm/assests.git assests_repo
          if [ -d "assests_repo/fonts/IOS - San Francisco/SF-Pro" ]; then
            cp -r "assests_repo/fonts/IOS - San Francisco/SF-Pro"/* assets_bundle/fonts/sf_pro/
          fi

          # Fetch Google Sans Flex
          wget -q -O assets_bundle/fonts/GoogleSansFlex.ttf \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/googlesansflex/GoogleSansFlex%5BGRAD%2CROND%2Copsz%2Cslnt%2Cwdth%2Cwght%5D.ttf" || echo "GSF fallback"

          rm -rf assests_repo

      - name: Build Instafel Engine & Update Patcher Sources
        if: steps.prepare_apk.outputs.skip_build != 'true'
        run: |
          echo "Building :app and updating patcher-core embedded sources..."
          ./gradlew updatePatcherSources
          ./gradlew :patcher:build-jar

      - name: Initialize Decompilation
        if: steps.prepare_apk.outputs.skip_build != 'true'
        run: |
          PATCHER_JAR=$(find .output -name "ifl-patcher*.jar" | head -n 1)
          echo "Using patcher: $PATCHER_JAR"
          java -jar "$PATCHER_JAR" about
          java -jar "$PATCHER_JAR" init instagram.apk

      - name: Bundle Fonts & Emojis into Target APK
        if: steps.prepare_apk.outputs.skip_build != 'true'
        run: |
          echo "Copying fonts and emoji assets into target APK..."
          mkdir -p instagram/sources/assets/fonts/sf_pro
          mkdir -p instagram/sources/assets/emojis

          cp -r assets_bundle/fonts/* instagram/sources/assets/fonts/
          cp -r assets_bundle/emojis/* instagram/sources/assets/emojis/

      - name: Run Patches (with Typography & Emojis)
        if: steps.prepare_apk.outputs.skip_build != 'true'
        run: |
          PATCHER_JAR=$(find .output -name "ifl-patcher*.jar" | head -n 1)
          java -jar "$PATCHER_JAR" run instagram unlock_developer_options remove_ads amoled_theme remove_snooze_warning instafel font_emoji change_channel_name clone

      - name: Build & Sign Final APK
        if: steps.prepare_apk.outputs.skip_build != 'true'
        run: |
          PATCHER_JAR=$(find .output -name "ifl-patcher*.jar" | head -n 1)
          java -jar "$PATCHER_JAR" build instagram

      - name: Package & Prepare Output Deliverables
        if: steps.prepare_apk.outputs.skip_build != 'true'
        run: |
          VERSION="${{ steps.prepare_apk.outputs.version }}"
          OUTPUT_APK="instafel-v${VERSION}-arm64-v8a.apk"
          cp instagram/instagram-signed.apk "$OUTPUT_APK"
          echo "output_apk=$OUTPUT_APK" >> $GITHUB_ENV

      - name: Upload Production APK Artifact
        if: steps.prepare_apk.outputs.skip_build != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: instafel-production-apk
          path: ${{ env.output_apk }}
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: steps.prepare_apk.outputs.skip_build != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.prepare_apk.outputs.version }}"
          TAG_NAME="v${VERSION}"
          RELEASE_TITLE="Instafel v${VERSION} (Alpha arm64-v8a)"

          gh release create "$TAG_NAME" "${{ env.output_apk }}" \
            --title "$RELEASE_TITLE" \
            --notes "### Instafel Alpha Release v${VERSION}
          - **Architecture:** \`arm64-v8a\`
          - **Automated Pipeline:** 100% Autonomous CI/CD Release
          - **Custom Typography Engine:**
            - Apple San Francisco Pro (\`SF Pro\`) multi-weight hierarchy
            - Google Sans Flex (\`opsz=ON\`, \`wdth=97.5\`, \`ROND=73\`, context weights 300–800)
          - **Custom Emoji Engine:**
            - Apple iOS Emojis (iOS 26.4 glyph suite)
            - Google 3D Emojis (\`GoogleEmoji3D.ttf\` vector/color emojis)
          - **Patches Applied:** Developer Options, Remove Ads, AMOLED Theme, Snooze Bypass, Clone, Channel Name."
