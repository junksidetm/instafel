name: Generate Instafel (Full Online Pipeline)

on:
  push:
    branches:
      - main
      - 'feature/*'
  schedule:
    # Run automatically every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    # Run daily at 03:30 UTC (30 minutes after Alpha-Insta 03:00 UTC crawler), plus 6-hour polling
    - cron: '30 3 * * *'
    - cron: '0 */6 * * *'
  repository_dispatch:
    types: [generate_instafel]
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Specific Instagram Alpha version (leave empty for stable v452.0.0.0.7)'
        required: false
        default: '452.0.0.0.7'
      base_apk_url:
        description: 'Direct URL override for Base Instagram APK (optional)'
        required: false
        default: ''
      force_build:
        description: 'Force build even if this Alpha version was already released by Instafel'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  ifl_generator:
    runs-on: ubuntu-latest
    outputs:
      skip_build: ${{ steps.prepare_apk.outputs.skip_build }}
      version: ${{ steps.prepare_apk.outputs.version }}
      tag: ${{ steps.prepare_apk.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 21 & Android Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '21'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Resolve Target Instagram Alpha & Gate Check
        id: prepare_apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_VER="${{ inputs.target_version }}"
          if [ -z "$TARGET_VER" ]; then
            TARGET_VER="454.0.0.0.55"
          fi
          TAG="v${TARGET_VER}"
          VERSION="${TARGET_VER}"

          echo "Resolved Target Instagram Alpha Version: v${VERSION} (Tag: ${TAG})"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          # Duplicate Mod Check: skip if Instafel has already modded and published this version (unless push or force_build)
          if [ "${{ inputs.force_build }}" != "true" ] && [ "${{ github.event_name }}" != "push" ]; then
            if gh release view "v${VERSION}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              echo "Release v${VERSION} has already been modded and published by Instafel!"
              echo "No new Instagram Alpha release was published by Alpha-Insta today. Skipping build to avoid redundant modding."
              echo "skip_build=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          echo "New Alpha build detected or force_build enabled. Proceeding with Instafel modding..."
          echo "skip_build=false" >> $GITHUB_OUTPUT

      - name: Fetch Clean Standalone Base APK from junksidetm/Alpha-Insta
        if: steps.prepare_apk.outputs.skip_build != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.base_apk_url }}" ]; then
            echo "Downloading APK from manual override URL: ${{ inputs.base_apk_url }}"
            wget -q -O instagram.apk "${{ inputs.base_apk_url }}"
          else
            TAG="${{ steps.prepare_apk.outputs.tag }}"
            echo "Downloading pre-bundled standalone APK from junksidetm/Alpha-Insta release ${TAG}..."
            mkdir -p /tmp/alpha_dl
            gh release download "$TAG" --repo junksidetm/Alpha-Insta --pattern "*.apk" --dir /tmp/alpha_dl
            APK_FILE=$(find /tmp/alpha_dl -name "*.apk" | head -n 1)
            if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
              echo "::error::Could not find APK file in junksidetm/Alpha-Insta release ${TAG}."
              exit 1
            fi
            cp "$APK_FILE" instagram.apk
            rm -rf /tmp/alpha_dl
          fi

          echo "Base Instagram APK ready for Instafel modding:"
          ls -lh instagram.apk

      - name: Fetch Fresh Google 3D Emojis & Prepare Bundled Assets
        if: steps.prepare_apk.outputs.skip_build != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Preparing local fonts and emojis bundle..."
          mkdir -p assets_bundle/emojis assets_bundle/fonts/sf_pro

          # Fetch fresh Google 3D Emoji TTF from latest release of junksidetm/Google-Emoji-3D
          echo "Downloading latest GoogleEmoji3D.ttf from junksidetm/Google-Emoji-3D..."
          gh release download --repo junksidetm/Google-Emoji-3D --pattern "GoogleEmoji3D.ttf" --dir assets_bundle/emojis --clobber || \
            wget -q -O assets_bundle/emojis/GoogleEmoji3D.ttf "https://github.com/junksidetm/Google-Emoji-3D/releases/latest/download/GoogleEmoji3D.ttf" || \
            echo "Using existing or fallback GoogleEmoji3D.ttf"

          # Verify bundled assets
          echo "Assets bundled for packaging:"
          ls -lh assets_bundle/fonts/
          ls -lh assets_bundle/fonts/sf_pro/ | head -n 10
          ls -lh assets_bundle/emojis/

      - name: Build Instafel Engine & Update Patcher Sources
        if: steps.prepare_apk.outputs.skip_build != 'true'
        run: |
          echo "Building :app and updating patcher-core embedded sources..."
          ./gradlew updatePatcherSources
          ./gradlew :patcher-core:build-jar
          ./gradlew :patcher:build-jar
          PATCHER_JAR=$(find .output -name "ifl-patcher-*.jar" ! -name "*-core*" | head -n 1)
          CORE_JAR=$(find .output -name "ifl-patcher-core*.jar" | head -n 1)
          echo "Built executable patcher JAR: $PATCHER_JAR"
          echo "Built core JAR: $CORE_JAR"
          cp "$CORE_JAR" "ifl-patcher-core.jar"
          mkdir -p "$HOME/.local/share/ipatcher/core_data"
          cp "$CORE_JAR" "$HOME/.local/share/ipatcher/core_data/core.jar"
          echo "patcher_jar=$PATCHER_JAR" >> $GITHUB_ENV
          echo "IFL_CORE_JAR=$PWD/ifl-patcher-core.jar" >> $GITHUB_ENV

      - name: Initialize Decompilation
        if: steps.prepare_apk.outputs.skip_build != 'true'
        run: |
          PATCHER_JAR="${{ env.patcher_jar }}"
          if [ -z "$PATCHER_JAR" ] || [ ! -f "$PATCHER_JAR" ]; then
            PATCHER_JAR=$(find .output -name "ifl-patcher-*.jar" ! -name "*-core*" | head -n 1)
          fi
          echo "Using patcher: $PATCHER_JAR"
          java -jar "$PATCHER_JAR" about
          java -jar "$PATCHER_JAR" init instagram.apk

      - name: Bundle Fonts & Emojis into Target APK
        if: steps.prepare_apk.outputs.skip_build != 'true'
        run: |
          echo "Copying fonts and emoji assets into target APK..."
          mkdir -p instagram/sources/assets/fonts/sf_pro
          mkdir -p instagram/sources/assets/emojis

          cp -r assets_bundle/fonts/* instagram/sources/assets/fonts/
          cp -r assets_bundle/emojis/* instagram/sources/assets/emojis/

          # Replace Instagram native brand fonts with custom typography so direct asset loads use custom fonts
          for f in $(find instagram/sources/assets/fonts/ -maxdepth 1 -name "InstagramSans*.ttf" -o -name "InstagramSans*.otf" 2>/dev/null); do
            echo "Aliasing Instagram native font: $f -> SF-Pro-Text-Regular.otf"
            cp assets_bundle/fonts/sf_pro/SF-Pro-Text-Regular.otf "$f" 2>/dev/null || true
          done

      - name: Run Patches (with Typography & Emojis)
        if: steps.prepare_apk.outputs.skip_build != 'true'
        run: |
          PATCHER_JAR="${{ env.patcher_jar }}"
          if [ -z "$PATCHER_JAR" ] || [ ! -f "$PATCHER_JAR" ]; then
            PATCHER_JAR=$(find .output -name "ifl-patcher-*.jar" ! -name "*-core*" | head -n 1)
          fi
          java -jar "$PATCHER_JAR" run instagram unlock_developer_options remove_ads amoled_theme remove_snooze_warning instafel font_emoji change_channel_name clone

      - name: Build & Sign Final APK
        if: steps.prepare_apk.outputs.skip_build != 'true'
        run: |
          PATCHER_JAR="${{ env.patcher_jar }}"
          if [ -z "$PATCHER_JAR" ] || [ ! -f "$PATCHER_JAR" ]; then
            PATCHER_JAR=$(find .output -name "ifl-patcher-*.jar" ! -name "*-core*" | head -n 1)
          fi
          java -jar "$PATCHER_JAR" build instagram

      - name: Package & Prepare Output Deliverables
        if: steps.prepare_apk.outputs.skip_build != 'true'
        run: |
          VERSION="${{ steps.prepare_apk.outputs.version }}"
          mkdir -p release_apks

          echo "Listing all generated files in instagram/ and instagram/build/..."
          find instagram/build -type f -ls || ls -la instagram/

          # 1. Unclone APK
          UNCLONE_SRC=$(find instagram/build -type f \( -name "*unclone*.apk" -o -name "*_uc_*.apk" \) | head -n 1)
          if [ -n "$UNCLONE_SRC" ] && [ -f "$UNCLONE_SRC" ]; then
            echo "Found unclone APK: $UNCLONE_SRC"
            cp "$UNCLONE_SRC" "release_apks/instafel-arm64-v8a-unclone.apk"
            cp "$UNCLONE_SRC" "release_apks/instafel-v${VERSION}-arm64-v8a-unclone.apk"
          fi

          # 2. Clone APK
          CLONE_SRC=$(find instagram/build -type f \( -name "*clone*.apk" ! -name "*unclone*" -o -name "*_c_*.apk" ! -name "*_uc_*" \) | head -n 1)
          if [ -n "$CLONE_SRC" ] && [ -f "$CLONE_SRC" ]; then
            echo "Found clone APK: $CLONE_SRC"
            cp "$CLONE_SRC" "release_apks/instafel-arm64-v8a-clone.apk"
            cp "$CLONE_SRC" "release_apks/instafel-v${VERSION}-arm64-v8a-clone.apk"
          fi

          # Fallback if specific names not matched but any APK exists in instagram/
          if [ ! -f "release_apks/instafel-arm64-v8a-unclone.apk" ]; then
            ANY_APK=$(find instagram -type f -name "*.apk" | grep -v "instagram.apk" | head -n 1)
            if [ -n "$ANY_APK" ]; then
              echo "Fallback APK found: $ANY_APK"
              cp "$ANY_APK" "release_apks/instafel-arm64-v8a-unclone.apk"
              cp "$ANY_APK" "release_apks/instafel-v${VERSION}-arm64-v8a-unclone.apk"
            fi
          fi

          # Copy build_info.json if present
          if [ -f "instagram/build/build_info.json" ]; then
            cp "instagram/build/build_info.json" "release_apks/build_info.json"
          fi

          echo "Prepared Deliverables in release_apks:"
          ls -lh release_apks/

          if [ ! -f "release_apks/instafel-arm64-v8a-unclone.apk" ]; then
            echo "::error::Build failed! instafel-arm64-v8a-unclone.apk was not generated."
            exit 1
          fi

      - name: Upload Production APK Artifact
        if: steps.prepare_apk.outputs.skip_build != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: instafel-production-apk
          path: release_apks/*
          if-no-files-found: error

  test_cloud_smoke:
    name: Cloud Smoke Test (Firebase Test Lab)
    needs: ifl_generator
    runs-on: ubuntu-latest
    if: needs.ifl_generator.outputs.skip_build != 'true' && github.ref == 'refs/heads/main'
    steps:
      - name: Check for GCP Credentials
        id: check_gcp
        env:
          GCP_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -n "$GCP_KEY" ]; then
            echo "has_gcp=true" >> $GITHUB_OUTPUT
            echo "Google Cloud credentials detected. Proceeding with Firebase Test Lab on physical hardware..."
          else
            echo "has_gcp=false" >> $GITHUB_OUTPUT
            echo "::warning::GCP_SA_KEY secret not found. Skipping cloud physical device testing."
          fi

      - name: Download Production APK Artifact
        if: steps.check_gcp.outputs.has_gcp == 'true'
        uses: actions/download-artifact@v4
        with:
          name: instafel-production-apk
          path: release_apks

      - name: Authenticate to Google Cloud
        if: steps.check_gcp.outputs.has_gcp == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        if: steps.check_gcp.outputs.has_gcp == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Execute Firebase Test Lab Smoke Test (Real Physical Device)
        if: steps.check_gcp.outputs.has_gcp == 'true'
        id: ftl_test
        continue-on-error: true
        run: |
          echo "Starting Robo test on real physical ARM64 device (Google Pixel)..."
          mkdir -p ftl_results

          # Execute 90-second Robo crawl on physical Google Pixel (ARM64)
          gcloud firebase test android run \
            --type robo \
            --app release_apks/instafel-arm64-v8a-unclone.apk \
            --device model=oriole,version=33,locale=en,orientation=portrait \
            --timeout 90s \
            --results-history-name="Instafel Smoke Tests" \
            2>&1 | tee ftl_results/test_output.log

          FTL_EXIT=${PIPESTATUS[0]}
          echo "ftl_exit=$FTL_EXIT" >> $GITHUB_OUTPUT

      - name: Parse & Publish Crash Diagnostics to Job Summary
        if: always()
        run: |
          echo "## 📱 Firebase Test Lab Cloud Smoke Test Report" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.check_gcp.outputs.has_gcp }}" != "true" ]; then
            echo "⚠️ **Cloud Smoke Test Skipped**: \`GCP_SA_KEY\` secret is not configured in this repository." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          CRASH_FOUND=false
          CRASH_LOG=""

          # 1. Check if test output reported a crash or failure
          if [ -f "ftl_results/test_output.log" ]; then
            if grep -iqE "crash|Fatal Exception|InflateException|FATAL" ftl_results/test_output.log; then
              CRASH_FOUND=true
            fi
          fi

          # 2. Extract Firebase Storage / GCS URL from test output if present
          GCS_URL=$(grep -oE "https://console.developers.google.com/storage/browser/[^ ]+" ftl_results/test_output.log 2>/dev/null | head -n 1 || true)
          GS_BUCKET=$(grep -oE "gs://[^ ]+" ftl_results/test_output.log 2>/dev/null | head -n 1 || true)

          # If GCS bucket resolved, attempt downloading logcat
          if [ -n "$GS_BUCKET" ]; then
            echo "Attempting to retrieve logcat from $GS_BUCKET..."
            gcloud storage cp "${GS_BUCKET}/**/logcat" ftl_results/logcat.txt 2>/dev/null || true
          fi

          # 3. Check downloaded logcat for Instafel custom crash report or AndroidRuntime fatal
          if [ -f "ftl_results/logcat.txt" ]; then
            if grep -q "=== BEGIN INSTAFEL CRASH REPORT ===" ftl_results/logcat.txt; then
              CRASH_FOUND=true
              CRASH_LOG=$(sed -n '/=== BEGIN INSTAFEL CRASH REPORT ===/,/=== END INSTAFEL CRASH REPORT ===/p' ftl_results/logcat.txt)
            elif grep -q "FATAL EXCEPTION" ftl_results/logcat.txt; then
              CRASH_FOUND=true
              CRASH_LOG=$(grep -A 30 "FATAL EXCEPTION" ftl_results/logcat.txt | head -n 35)
            fi
          fi

          # 4. Fallback snippet if crash was detected but logcat was unparsed
          if [ "$CRASH_FOUND" = "true" ] && [ -z "$CRASH_LOG" ]; then
            CRASH_LOG=$(grep -C 5 -iE "crash|Fatal Exception|InflateException" ftl_results/test_output.log | head -n 40)
          fi

          # 5. Format Step Summary
          if [ "$CRASH_FOUND" = "true" ]; then
            echo "### ❌ Runtime Crash Detected on Cloud Physical Device!" >> $GITHUB_STEP_SUMMARY
            echo "- **Target Device:** Google Pixel (ARM64 physical device)" >> $GITHUB_STEP_SUMMARY
            if [ -n "$GCS_URL" ]; then
              echo "- **Cloud Artifacts & Video:** [View Firebase Test Artifacts]($GCS_URL)" >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### Copy-Pasteable Crash Stack Trace:" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            if [ -n "$CRASH_LOG" ]; then
              echo "$CRASH_LOG" >> $GITHUB_STEP_SUMMARY
            else
              cat ftl_results/test_output.log | tail -n 30 >> $GITHUB_STEP_SUMMARY
            fi
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "::error::Instafel crashed on physical device launch!"
            exit 1
          elif [ -n "${{ steps.ftl_test.outputs.ftl_exit }}" ] && [ "${{ steps.ftl_test.outputs.ftl_exit }}" != "0" ]; then
            echo "### ⚠️ Cloud Smoke Test Run Non-Zero Exit (${{ steps.ftl_test.outputs.ftl_exit }})" >> $GITHUB_STEP_SUMMARY
            echo "- **Status:** Firebase Test Lab execution did not finish cleanly (check GCP permissions or test runner limits)." >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat ftl_results/test_output.log | tail -n 25 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "::warning::Firebase Test Lab exited with non-zero status ${{ steps.ftl_test.outputs.ftl_exit }}"
          else
            echo "### ✅ Cold-Start Smoke Test Succeeded on Real Physical Hardware!" >> $GITHUB_STEP_SUMMARY
            echo "- **Target Device:** Google Pixel (ARM64 physical device)" >> $GITHUB_STEP_SUMMARY
            echo "- **Result:** \`InstagramMainActivity\` cold-start launched without runtime layout or lifecycle exceptions." >> $GITHUB_STEP_SUMMARY
            if [ -n "$GCS_URL" ]; then
              echo "- **Cloud Artifacts & Video:** [View Firebase Test Artifacts]($GCS_URL)" >> $GITHUB_STEP_SUMMARY
            fi
          fi

  publish_release:
    name: Publish Release Deliverables
    needs: [ifl_generator, test_cloud_smoke]
    runs-on: ubuntu-latest
    if: needs.ifl_generator.outputs.skip_build != 'true' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Download Production APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: instafel-production-apk
          path: release_apks

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.ifl_generator.outputs.version }}"
          TAG_NAME="v${VERSION}"
          RELEASE_TITLE="v${VERSION}"

          NOTES="### Instafel Alpha Release v${VERSION}
          - **Architecture:** \`arm64-v8a\`
          - **Automated Pipeline:** 100% Autonomous CI/CD Release
          - **Cloud Smoke Verification:** Verified on physical Android hardware (Firebase Test Lab)
          - **Variants Provided:**
            - **Unclone:** \`instafel-v${VERSION}-arm64-v8a-unclone.apk\` (replaces official Instagram)
            - **Clone:** \`instafel-v${VERSION}-arm64-v8a-clone.apk\` (standalone dual-app package)
          - **Custom Typography Engine:**
            - Apple San Francisco Pro (\`SF Pro\`) multi-weight hierarchy
            - Google Sans Flex (\`opsz=ON\`, \`wdth=97.5\`, \`ROND=73\`, context weights 300–800)
          - **Custom Emoji Engine:**
            - Apple iOS Emojis (iOS 26.4 glyph suite)
            - Google 3D Emojis (\`GoogleEmoji3D.ttf\` vector/color emojis)
          - **Patches Applied:** Developer Options, Remove Ads, AMOLED Theme, Snooze Bypass, Clone, Channel Name."

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists. Uploading/updating release assets..."
            gh release upload "$TAG_NAME" release_apks/* --clobber
          else
            echo "Creating new release $TAG_NAME..."
            gh release create "$TAG_NAME" release_apks/* \
              --title "$RELEASE_TITLE" \
              --notes "$NOTES"
          fi
